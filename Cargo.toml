[package]
name = "matcha"
version = "0.1.0"
edition = "2024"
description = "A native regular expression workbench built on GPUI"
license = "MIT"
repository = "https://github.com/kakilangit/matcha"

[dependencies]
env_logger = "0.11.11"
fancy-regex = "0.19.2"
# Compile Metal shaders at startup so macOS builds need no full Xcode install.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
log = "0.4.34"
regex = "1.13.1"
regex-syntax = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# No panicking shortcuts in app code; tests may use them (see clippy.toml).
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

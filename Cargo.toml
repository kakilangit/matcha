[package]
name = "matcha"
version = "0.1.0"
edition = "2024"
description = "A native regular expression workbench built on GPUI"
license = "MIT"
repository = "https://github.com/kakilangit/matcha"

[dependencies]
env_logger = "0.11.11"
fancy-regex = "0.19.2"
# Compile Metal shaders at startup so macOS builds need no full Xcode install.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
log = "0.4.34"
regex = "1.13.1"

# Publishes a GitHub release when a version tag (e.g. v0.1.0) is pushed. The tag
# must point at a commit on main, match the version in Cargo.toml, and have a
# section in CHANGELOG.md, which becomes the release notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: make release-check
        env:
          TAG: ${{ github.ref_name }}

  package:
    needs: verify
    uses: ./.github/workflows/package.yml

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: make release-publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

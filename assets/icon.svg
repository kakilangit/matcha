<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Matcha app icon: a flat ".*" on a solid matcha-green tile. The tile follows
       the macOS icon grid (824px body on a 1024px canvas). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#5B8C3A"/>

  <!-- shifted so the pair of glyphs is centered on the tile -->
  <g fill="#FBF6E6" stroke="#FBF6E6" transform="translate(-38 34)">
    <!-- the dot of ".*", sitting on the baseline -->
    <circle cx="352" cy="672" r="78" stroke="none"/>
    <!-- the raised asterisk: three strokes through one center -->
    <g stroke-width="96" stroke-linecap="round" fill="none" transform="translate(624 432)">
      <line x1="0" y1="-178" x2="0" y2="178"/>
      <line x1="0" y1="-178" x2="0" y2="178" transform="rotate(60)"/>
      <line x1="0" y1="-178" x2="0" y2="178" transform="rotate(-60)"/>
    </g>
  </g>
</svg>
